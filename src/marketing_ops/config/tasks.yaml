# tasks.yaml — Equipe de Operação de Marketing (CrewAI)
# Cada chave é referenciada em crew.py via self.tasks_config["<chave>"].
# Dependências (context) são declaradas em crew.py. Portões humanos: human_input: true.
# Variáveis {…} vêm do dicionário `inputs` passado ao kickoff (ver docs/template-briefing.md).

# ───────────────────────── FASE 1 · ESTRATÉGIA ─────────────────────────

pesquisa_mercado:
  description: >
    Elabore o relatório de mercado para {cliente} ({segmento}, região {regiao}).
    Público-alvo declarado no briefing: {publico_alvo}. Objetivo da campanha: {objetivo}.
    Cubra: panorama e sazonalidade do mercado; até 5 concorrentes diretos (posicionamento,
    canais, oferta, força, fraqueza); tendências dos últimos 6-12 meses; dores, linguagem e
    objeções do público; oportunidades e ameaças (SWOT resumido).
    Toda afirmação factual deve ter URL e data de acesso. O que não puder ser confirmado deve
    ser listado em seção própria marcado [VALIDAR]. Não invente números.
  expected_output: >
    Documento Markdown "Relatório de Mercado" com as seções: Resumo (5 bullets), Panorama,
    Concorrência (tabela), Tendências, Público, Oportunidades e Ameaças, Itens [VALIDAR],
    Fontes (URL · data).
  agent: pesquisador_mercado
  output_file: output/01_relatorio_mercado.md

mapa_seo:
  description: >
    Com base no briefing e no relatório de mercado, construa o mapa de palavras-chave e as
    pautas priorizadas para {cliente}. Para cada termo: volume estimado (declare a fonte ou
    heurística), dificuldade, intenção (informacional, comercial, transacional, navegacional),
    etapa do funil, persona e URL concorrente que ranqueia. Agrupe em clusters, priorize por
    impacto × esforço e escreva os requisitos on-page de cada pauta prioritária (title, meta,
    H1, estrutura H2/H3, perguntas a responder, entidades, links internos, schema, tamanho).
    Site atual para auditoria rápida (se houver): {site_url}.
  expected_output: >
    Documento Markdown com: (1) tabela do mapa de palavras-chave; (2) tabela de pautas
    priorizadas; (3) bloco de requisitos on-page por pauta prioritária; (4) oportunidades de
    AEO/respostas diretas; (5) achados da auditoria rápida, se aplicável.
  agent: especialista_seo
  output_file: output/02_mapa_seo.md

brief_estrategico:
  description: >
    Elabore o brief estratégico da campanha "{briefing_titulo}" para {cliente}, usando o
    briefing original, o relatório de mercado e o mapa de SEO. Defina objetivos SMART com
    baseline e fonte, KPI norteador, personas (dores, gatilhos, objeções, canais), proposta de
    valor, matriz de mensagens (persona × etapa do funil), mix de canais com papel no funil e KPI
    próprio, alocação do orçamento total de {orcamento_total} (soma 100%, cenários conservador e
    otimista), hipóteses a testar e riscos. Consulte o guia de marca do cliente com a ferramenta brand_book_lookup antes de definir
    mensagens e tom; respeite-o. Prazo da campanha: {prazo}.
    Este documento será lido por um(a) diretor(a) em 5 minutos: seja objetivo.
  expected_output: >
    Documento Markdown "Brief Estratégico" com as 9 seções do template (Contexto, Objetivos
    SMART, Público e personas, Proposta de valor e matriz de mensagens, Mix de canais, Orçamento,
    Hipóteses, Riscos e premissas, Fontes).
  agent: estrategista_campanhas
  output_file: output/03_brief_estrategico.md

revisao_g1:
  description: >
    Revise o brief estratégico quanto a: coerência com o briefing, objetivos mensuráveis com
    baseline, aderência ao guia de marca do cliente (consulte com brand_book_lookup: DNA, tom, paleta, termos), riscos
    regulatórios das mensagens propostas (CONAR/CDC, setor regulado) e itens [VALIDAR] não
    resolvidos. Emita parecer: Aprovado, Aprovado com ajustes (lista) ou Reprovado (motivo e
    regra). Não reescreva o brief.
  expected_output: >
    Parecer Markdown com resultado, checklist por dimensão (status, apontamento, regra,
    correção sugerida) e riscos residuais.
  agent: guardiao_marca_compliance
  output_file: output/04_parecer_g1.md

portao_g1:
  description: >
    PORTÃO G1 — Aprovação humana da estratégia. Apresente ao aprovador um resumo de 10 linhas
    do brief estratégico, o resultado do parecer de revisão e os riscos principais. Peça a
    decisão: aprovar, aprovar com ajustes ou reprovar. Se houver ajustes, liste-os e incorpore
    ao brief antes de seguir. Registre a decisão (data, aprovador, observações).
  expected_output: >
    Registro de decisão G1 em Markdown: resumo apresentado, decisão, ajustes solicitados,
    brief estratégico final (versão aprovada).
  agent: gerente_operacoes
  human_input: true
  output_file: output/05_decisao_g1.md

# ───────────────────────── FASE 2 · PRODUÇÃO ─────────────────────────

producao_conteudo:
  description: >
    Escreva o(s) conteúdo(s) longo(s) definidos no brief estratégico aprovado (por exemplo,
    artigo pilar e landing page), seguindo integralmente os requisitos on-page do mapa de SEO e
    o guia de marca do cliente (consulte-o com a ferramenta brand_book_lookup). Inclua o cabeçalho de metadados (titulo, title_seo, meta_description, slug,
    kw_principal, persona, etapa_funil, cta_principal, notas_visuais, fontes), 3 variações de
    título e 2 de CTA. Nenhum dado sem fonte. Marque [AVAL ESPECIALISTA] onde couber.
  expected_output: >
    Um bloco Markdown por conteúdo, com cabeçalho de metadados, texto final, variações de título
    e CTA e notas visuais para o Diretor de Arte.
  agent: redator_conteudo
  output_file: output/06_conteudo.md

calendario_social:
  description: >
    Monte o calendário editorial de {duracao_semanas} semanas para {plataformas_sociais},
    derivado do brief estratégico e do conteúdo-base. Para cada post: data, plataforma,
    formato, pilar, objetivo, KPI, hook, copy, CTA, hashtags, asset necessário. Adapte a
    mensagem por plataforma (não replique). Inclua guia de engajamento (respostas-padrão,
    comunidades, UGC) e indique posts candidatos a impulsionamento.
  expected_output: >
    (1) Tabela do calendário editorial em Markdown (colunas padronizadas); (2) copies completas
    por plataforma; (3) guia de engajamento; (4) lista de assets para o Diretor de Arte com
    dimensões e quantidade.
  agent: estrategista_social
  output_file: output/07_calendario_social.md

fluxos_email:
  description: >
    Desenhe a segmentação e os fluxos de e-mail da campanha (ex.: boas-vindas, nutrição,
    reativação) a partir do brief estratégico e do conteúdo-base. Para cada segmento: critérios,
    tamanho estimado, base legal LGPD. Para cada fluxo: gatilho, objetivo, KPI, tabela de etapas
    (espera, condição, e-mail, CTA, saída). Escreva cada e-mail com assunto (+2 variações),
    pré-header, corpo, CTA e alt text. Inclua checklist de entregabilidade. Ferramenta de
    CRM/automação do cliente: {ferramenta_crm}.
  expected_output: >
    Documento Markdown com Segmentação, Fluxos (diagrama em texto + tabelas), E-mails completos,
    Plano de testes e Checklist de entregabilidade.
  agent: especialista_email_crm
  output_file: output/08_fluxos_email.md

plano_midia_paga:
  description: >
    Elabore o plano de mídia paga com orçamento de {orcamento_midia}, a partir do brief
    estratégico, do mapa de SEO (termos de alta intenção) e da pesquisa de concorrência.
    Defina arquitetura por plataforma e etapa do funil, públicos (tipo, fonte, tamanho estimado,
    base legal), palavras-chave e negativas, copies de anúncios com variações (RSA, Meta,
    LinkedIn conforme o mix), orçamento e lances, projeções em 3 cenários com premissas
    declaradas, rotina semanal de otimização e requisitos de rastreamento. Briefe os criativos
    necessários (formato, dimensão, quantidade). NÃO crie nem ative nada em plataforma.
  expected_output: >
    Documento Markdown "Plano de Mídia" com as 9 seções do template, tabela de estrutura de
    campanhas e briefing de criativos.
  agent: gestor_midia_paga
  output_file: output/09_plano_midia.md

direcao_arte:
  description: >
    Defina o conceito criativo da campanha e produza um briefing por peça para todos os assets
    solicitados pelos planos de social, e-mail e mídia paga e pelas notas visuais do conteúdo.
    Para cada peça: objetivo, mensagem, texto na arte, hierarquia visual, dimensões/duração,
    variações, referências, prompt de geração (se IA), restrições de marca e acessibilidade
    (contraste AA, alt text). Indique quando a peça exige fotografia real ou designer humano.
  expected_output: >
    Documento Markdown com Conceito criativo, Briefings por peça (template padronizado),
    Prompts de imagem e Checklist de specs por plataforma.
  agent: diretor_arte
  output_file: output/10_direcao_arte.md

revisao_g2:
  description: >
    Revise TODAS as entregas de produção (conteúdo, calendário social, fluxos de e-mail, plano
    de mídia, direção de arte) quanto a marca, qualidade editorial, veracidade e fontes, LGPD,
    CONAR/CDC, políticas de plataforma e setor regulado. Emita um parecer por entrega com
    resultado, apontamentos (regra + correção) e riscos residuais. Não reescreva as peças.
  expected_output: >
    Documento Markdown com um parecer por entrega (template de checklist) e um quadro-resumo
    final: entrega × resultado × nº de ajustes.
  agent: guardiao_marca_compliance
  output_file: output/11_parecer_g2.md

portao_g2:
  description: >
    PORTÃO G2 — Aprovação humana dos criativos e planos. Apresente ao aprovador o quadro-resumo
    dos pareceres, os ajustes pendentes e amostras (1 título, 1 post, 1 e-mail, 1 anúncio).
    Peça a decisão por entrega. Coordene a incorporação dos ajustes com os agentes responsáveis
    e registre a decisão (data, aprovador, observações).
  expected_output: >
    Registro de decisão G2 em Markdown: quadro de decisões por entrega, ajustes aplicados e
    lista de entregas liberadas para publicação.
  agent: gerente_operacoes
  human_input: true
  output_file: output/12_decisao_g2.md

# ───────────────────────── FASE 3 · MEDIÇÃO E PUBLICAÇÃO ─────────────────────────

plano_medicao:
  description: >
    Elabore o plano de medição da campanha: KPIs com definição operacional, fórmula, fonte,
    frequência e dono; dicionário de UTMs (source, medium, campaign, content, term em minúsculas
    e sem espaços) para todos os links de social, e-mail e mídia paga; eventos de conversão a
    configurar ({ferramenta_analytics}); especificação do dashboard (visões, filtros, métricas);
    checklist de rastreamento a validar antes de G3.
  expected_output: >
    Documento Markdown com Plano de medição (tabela de KPIs), Dicionário de UTMs (tabela),
    Eventos de conversão, Spec do dashboard e Checklist de rastreamento.
  agent: analista_dados
  output_file: output/13_plano_medicao.md

pacote_publicacao:
  description: >
    Consolide as entregas liberadas em G2 em um pacote de publicação: índice de peças com
    versão final e nome de arquivo padronizado (<cliente>_<campanha>_<canal>_<formato>_<versao>),
    cronograma de publicação por canal (data, hora, fuso {fuso_horario}, peça, link, UTM,
    responsável, status) e checklist pré-publicação por canal, conferindo UTMs contra o
    dicionário. NÃO publique nem agende nada nesta tarefa.
  expected_output: >
    Documento Markdown com Índice do pacote, Cronograma de publicação (tabela) e Checklist
    pré-publicação por canal com status.
  agent: coordenador_publicacao
  output_file: output/14_pacote_publicacao.md

revisao_g3:
  description: >
    Revise o pacote de publicação e o plano de medição: versões corretas, ajustes de G2
    aplicados, UTMs conformes, horários com fuso, base legal dos públicos e segmentos, ausência
    de itens [VALIDAR] ou [AVAL ESPECIALISTA] pendentes. Emita parecer final.
  expected_output: >
    Parecer Markdown do pacote com resultado, checklist e riscos residuais.
  agent: guardiao_marca_compliance
  output_file: output/15_parecer_g3.md

portao_g3:
  description: >
    PORTÃO G3 — Aprovação humana de publicação e investimento. Apresente ao aprovador o
    cronograma de publicação, o orçamento de mídia a ser ativado, o resultado do parecer final e
    o status do checklist de rastreamento. Peça autorização explícita para publicar/agendar e
    ativar campanhas. Registre a decisão (data, aprovador, canais autorizados, orçamento
    autorizado).
  expected_output: >
    Registro de decisão G3 em Markdown com canais e orçamento autorizados e eventuais
    restrições.
  agent: gerente_operacoes
  human_input: true
  output_file: output/16_decisao_g3.md

execucao_publicacao:
  description: >
    Com a decisão G3 registrada, execute ou gere as instruções passo a passo de publicação e
    agendamento por canal, estritamente dentro dos canais e do orçamento autorizados. Registre o
    log de publicação (data/hora real, canal, peça, link publicado, responsável). Se alguma
    ferramenta de escrita não estiver disponível, produza o roteiro operacional para o humano.
  expected_output: >
    Log de publicação em Markdown (tabela) e, quando aplicável, roteiro operacional por canal.
  agent: coordenador_publicacao
  output_file: output/17_log_publicacao.md

sumario_executivo:
  description: >
    Consolide a campanha "{briefing_titulo}" em um sumário executivo de uma página: objetivo e
    KPI norteador, o que foi entregue por canal, decisões dos portões, riscos abertos, itens
    [VALIDAR]/[AVAL ESPECIALISTA] pendentes, plano de medição e próximos passos (relatório de
    48h, semanal e final pelo Analista de Dados). Inclua os KPIs operacionais da crew observados
    nesta execução (número de iterações, retrabalhos, reprovações).
  expected_output: >
    Documento Markdown "Sumário Executivo" de uma página com as seções listadas e um quadro de
    próximos passos com responsável e data.
  agent: gerente_operacoes
  output_file: output/18_sumario_executivo.md

# ───────────────────────── PÓS-CAMPANHA (execução separada) ─────────────────────────

relatorio_performance:
  description: >
    Produza o relatório de performance do período {periodo_relatorio} da campanha
    "{briefing_titulo}", a partir dos dados fornecidos em {caminho_dados} (CSV/JSON exportados
    das plataformas) e do plano de medição. Compare KPIs vs. meta, analise por canal, separe fato
    de hipótese e priorize recomendações por impacto × esforço.
  expected_output: >
    Relatório Markdown com Resumo executivo (3 bullets), KPIs vs. meta (tabela), Por canal,
    Insights, Recomendações priorizadas e Fontes.
  agent: analista_dados
  output_file: output/19_relatorio_performance.md

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 596" width="1080" height="596" role="img" aria-label="Camadas de controle"><rect width="1080" height="596" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E10D16"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B5C5E"/></marker></defs><text x="20" y="30" font-size="17" fill="#140A0B" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Camadas de controle de qualidade</text><text x="20" y="48" font-size="11" fill="#6B5C5E" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Do prompt à decisão humana: cada camada reduz o risco da seguinte; nenhuma é absoluta</text><rect x="40" y="70" width="1000" height="64" rx="10" fill="#EFEAEA" stroke="#D9CFD0" stroke-width="1.2" /><circle cx="70" cy="102" r="15" fill="#E10D16"/><text x="70" y="107" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >1</text><text x="96" y="97" font-size="13" fill="#140A0B" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Prompt da tarefa</text><text x="96" y="116" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Regras, formato obrigatório, rotina de mídia e base de marca do cliente no contexto</text><rect x="60" y="146" width="960" height="64" rx="10" fill="#FDF1DC" stroke="#D9CFD0" stroke-width="1.2" /><circle cx="90" cy="178" r="15" fill="#E10D16"/><text x="90" y="183" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >2</text><text x="116" y="173" font-size="13" fill="#A15C00" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Travas em código por tarefa</text><text x="116" y="192" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Superlativos, garantias, placeholders, fonte inventada, objetivo literal, percentuais, canal fora do brief, conversões, calendário</text><rect x="80" y="222" width="920" height="64" rx="10" fill="#FDF1DC" stroke="#D9CFD0" stroke-width="1.2" /><circle cx="110" cy="254" r="15" fill="#E10D16"/><text x="110" y="259" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >3</text><text x="136" y="249" font-size="13" fill="#A15C00" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Tentativas e alerta</text><text x="136" y="268" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Rejeita até 2 vezes com a mensagem da trava; na 3ª aceita e escreve ALERTA DE QUALIDADE no topo da saída</text><rect x="100" y="298" width="880" height="64" rx="10" fill="#FDEBEC" stroke="#D9CFD0" stroke-width="1.2" /><circle cx="130" cy="330" r="15" fill="#E10D16"/><text x="130" y="335" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >4</text><text x="156" y="325" font-size="13" fill="#AB0A10" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Revisões independentes</text><text x="156" y="344" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Guardião (parecer com citações verificadas), rubrica do Revisor (5 gates, 100 pontos), auditoria técnica do Supervisor de mídia</text><rect x="120" y="374" width="840" height="64" rx="10" fill="#E10D16" stroke="#E10D16" stroke-width="1.2" /><circle cx="150" cy="406" r="15" fill="#fff"/><text x="150" y="411" font-size="14" fill="#E10D16" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >5</text><text x="176" y="401" font-size="13" fill="#fff" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Portão humano G1, G2, G3</text><text x="176" y="420" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Pessoa decide no portal; o pedido copia pareceres literalmente e lista os alertas</text><rect x="140" y="450" width="800" height="64" rx="10" fill="#050000" stroke="#050000" stroke-width="1.2" /><circle cx="170" cy="482" r="15" fill="#E10D16"/><text x="170" y="487" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >6</text><text x="196" y="477" font-size="13" fill="#fff" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Portal</text><text x="196" y="496" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Caixa vermelha de alertas, contador por execução, histórico de decisões e trilha de quem decidiu</text><rect x="40" y="534" width="1000" height="40" rx="8" fill="#fff" stroke="#D9CFD0" stroke-width="1.2" /><text x="56" y="559" font-size="11" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Falha em qualquer camada: retrabalho da tarefa (camada 3), devolução ao autor (camada 4) ou decisão humana (camada 5). Publicação só depois de G3.</text></svg>
ue',Helvetica,Arial,sans-serif" >SUPABASE</text><rect x="604" y="112" width="162" height="50" rx="10" fill="#E3F6EA" stroke="#BFE3CE" stroke-width="1.2" /><text x="685" y="132" font-size="11" fill="#15803D" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Auth</text><text x="685" y="148" font-size="10" fill="#140A0B" font-weight="400" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >link, senha, convite</text><rect x="604" y="170" width="162" height="92" rx="10" fill="#E3F6EA" stroke="#BFE3CE" stroke-width="1.2" /><text x="685" y="188" font-size="11" fill="#15803D" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Postgres (RLS ligada)</text><text x="685" y="205" font-size="10" fill="#140A0B" font-weight="400" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >eventos, decisões, disparos</text><text x="685" y="219" font-size="10" fill="#140A0B" font-weight="400" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >clientes, perfis, convites</text><text x="685" y="233" font-size="10" fill="#140A0B" font-weight="400" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >conhecimento e versões</text><rect x="604" y="270" width="162" height="40" rx="10" fill="#E3F6EA" stroke="#BFE3CE" stroke-width="1.2" /><text x="685" y="288" font-size="11" fill="#15803D" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Realtime</text><text x="685" y="302" font-size="10" fill="#140A0B" font-weight="400" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >avisa que algo mudou</text><rect x="604" y="318" width="162" height="40" rx="10" fill="#E3F6EA" stroke="#BFE3CE" stroke-width="1.2" /><text x="685" y="336" font-size="11" fill="#15803D" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Edge Function</text><text x="685" y="350" font-size="10" fill="#140A0B" font-weight="400" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >crewai-webhook</text><rect x="830" y="70" width="230" height="300" rx="12" fill="#fff" stroke="#050000" stroke-width="2" /><rect x="830" y="70" width="230" height="30" rx="12" fill="#050000" stroke="#050000" stroke-width="2" /><text x="945" y="91" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >PLATAFORMA CREWAI (AMP)</text><rect x="846" y="112" width="198" height="128" rx="10" fill="#EFEAEA" stroke="#D9CFD0" stroke-width="1.2" /><text x="860" y="130" font-size="11" fill="#140A0B" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Crew (processo hierárquico)</text><text x="860" y="148" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >14 agentes · 23 tarefas</text><text x="860" y="163" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >3 fases · 3 portões humanos</text><text x="860" y="178" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Travas em código por tarefa</text><text x="860" y="193" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Alerta de qualidade no topo</text><text x="860" y="208" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >quando a trava esgota</text><rect x="846" y="250" width="198" height="50" rx="10" fill="#EFEAEA" stroke="#D9CFD0" stroke-width="1.2" /><text x="860" y="268" font-size="11" fill="#140A0B" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Modelo de linguagem</text><text x="860" y="284" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >e ferramentas de leitura</text><rect x="846" y="308" width="198" height="52" rx="10" fill="#FDF1DC" stroke="#F0D9A0" stroke-width="1.2" /><text x="860" y="326" font-size="11" fill="#A15C00" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >Publicação real: DESLIGADA</text><text x="860" y="342" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >(só depois de um G3 humano)</text><rect x="230" y="430" width="550" height="86" rx="12" fill="#F7F5F5" stroke="#D9CFD0" stroke-width="1.2" /><text x="245" y="452" font-size="12" fill="#140A0B" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >GITHUB (repositório público)</text><rect x="245" y="462" width="250" height="44" rx="10" fill="#fff" stroke="#D9CFD0" stroke-width="1.2" /><text x="257" y="480" font-size="11" fill="#AB0A10" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >main</text><text x="257" y="496" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >portal + docs + código da crew</text><rect x="510" y="462" width="255" height="44" rx="10" fill="#fff" stroke="#D9CFD0" stroke-width="1.2" /><text x="522" y="480" font-size="11" fill="#AB0A10" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >crewai-marketing-ops</text><text x="522" y="496" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >subárvore da crew (deploy)</text><rect x="830" y="430" width="170" height="86" rx="12" fill="#fff" stroke="#D9CFD0" stroke-width="1.2" /><text x="845" y="452" font-size="12" fill="#140A0B" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >VERCEL</text><text x="845" y="470" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >build automático da main</text><text x="845" y="485" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >pasta raiz: portal-aprovacao</text><rect x="20" y="430" width="170" height="86" rx="12" fill="#fff" stroke="#D9CFD0" stroke-width="1.2" /><text x="35" y="452" font-size="12" fill="#140A0B" font-weight="700" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >BASE DE MARCA</text><text x="35" y="470" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >55 guias de cliente</text><text x="35" y="485" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >1 por pasta · edição no portal</text><line x1="170" y1="215" x2="228" y2="215" stroke="#E10D16" stroke-width="2" marker-end="url(#a)"/><circle cx="199" cy="203" r="11" fill="#E10D16"/><text x="199" y="207" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >1</text><line x1="530" y1="150" x2="588" y2="150" stroke="#6B5C5E" stroke-width="1.8" marker-end="url(#g)"/><circle cx="559" cy="134" r="11" fill="#E10D16"/><text x="559" y="138" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'Helvetica Neue',Helve
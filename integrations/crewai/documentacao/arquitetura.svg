" font-size="9" fill="#6B5C5E" font-weight="400" text-anchor="end" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >guias lidos por URL</text><line x1="190" y1="473" x2="228" y2="473" stroke="#6B5C5E" stroke-width="1.6" marker-end="url(#g)"/><line x1="780" y1="484" x2="828" y2="484" stroke="#6B5C5E" stroke-width="1.6" marker-end="url(#g)"/><path d="M640,516 V536 H1040 V372" fill="none" stroke="#6B5C5E" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#g)"/><text x="660" y="530" font-size="9" fill="#6B5C5E" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >redeploy da subárvore, feito por pessoa</text><rect x="20" y="560" width="1040" height="56" rx="8" fill="#fff" stroke="#D9CFD0" stroke-width="1.2" /><text x="36" y="580" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >1 pessoa entra, escolhe o cliente e dispara · 2 o portal envia o briefing à plataforma · 3 a plataforma devolve cada entrega e cada pausa por webhook</text><text x="36" y="597" font-size="10.5" fill="#140A0B" font-weight="400" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" >4 o portal atualiza as telas em tempo real · 5 a decisão humana volta à plataforma e a execução continua · 6 o portal grava e lê decisões, disparos e conhecimento</text></svg>
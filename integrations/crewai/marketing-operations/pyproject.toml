[project]
name = "marketing_ops"
version = "1.0.0"
description = "Equipe de Operacao de Marketing - crew CrewAI com 12 agentes, 3 portoes de aprovacao humana e pipeline briefing -> campanha no ar"
authors = [{ name = "Jussara Cavalcante" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,anthropic]>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
marketing_ops = "marketing_ops.main:run"
run_crew = "marketing_ops.main:run"
train = "marketing_ops.main:train"
replay = "marketing_ops.main:replay"
test = "marketing_ops.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketing_ops"]

[tool.crewai]
type = "crew"

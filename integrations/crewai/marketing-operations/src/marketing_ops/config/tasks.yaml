# tasks.yaml — Equipe de Operação de Marketing (CrewAI)
# Cada chave é referenciada em crew.py via self.tasks_config["<chave>"].
# Dependências (context) são declaradas em crew.py. Portões humanos: human_input: true.
# Variáveis {…} vêm do dicionário `inputs` passado ao kickoff (ver docs/template-briefing.md).

# ───────────────────────── FASE 1 · ESTRATÉGIA ─────────────────────────

pesquisa_mercado:
  description: >
    Elabore o relatório de mercado para {cliente} ({segmento}, região {regiao}).
    Público-alvo declarado no briefing: {publico_alvo}. Objetivo da campanha: {objetivo}.
    Cubra: panorama e sazonalidade do mercado; até 5 concorrentes diretos (posicionamento,
    canais, oferta, força, fraqueza); tendências dos últimos 6-12 meses; dores, linguagem e
    objeções do público; oportunidades e ameaças (SWOT resumido).
    Toda afirmação factual deve ter URL e data de acesso. O que não puder ser confirmado deve
    ser listado em seção própria marcado [VALIDAR]. Não invente números.
  expected_output: >
    Documento Markdown "Relatório de Mercado" com as seções: Resumo (5 bullets), Panorama,
    Concorrência (tabela), Tendências, Público, Oportunidades e Ameaças, Itens [VALIDAR],
    Fontes (URL · data).
  agent: pesquisador_mercado
  output_file: output/01_relatorio_mercado.md

mapa_seo:
  description: >
    Com base no briefing e no relatório de mercado, construa o mapa de palavras-chave e as
    pautas priorizadas para {cliente}. Para cada termo: volume estimado (declare a fonte ou
    heurística), dificuldade, intenção (informacional, comercial, transacional, navegacional),
    etapa do funil, persona e URL concorrente que ranqueia. Agrupe em clusters, priorize por
    impacto × esforço e escreva os requisitos on-page de cada pauta prioritária (title, meta,
    H1, estrutura H2/H3, perguntas a responder, entidades, links internos, schema, tamanho).
    Site atual para auditoria rápida (se houver): {site_url}.
  expected_output: >
    Documento Markdown com: (1) tabela do mapa de palavras-chave; (2) tabela de pautas
    priorizadas; (3) bloco de requisitos on-page por pauta prioritária; (4) oportunidades de
    AEO/respostas diretas; (5) achados da auditoria rápida, se aplicável.
  agent: especialista_seo
  output_file: output/02_mapa_seo.md

brief_estrategico:
  description: >
    Elabore o brief estratégico da campanha "{briefing_titulo}" para {cliente}, usando o
    briefing original, o relatório de mercado e o mapa de SEO. Defina objetivos SMART com
    baseline e fonte, KPI norteador, personas (dores, gatilhos, objeções, canais), proposta de
    valor, matriz de mensagens (persona × etapa do funil), mix de canais com papel no funil e KPI
    próprio, alocação do orçamento total de {orcamento_total} (cenários conservador e
    otimista, divisão marcada [VALIDAR]), hipóteses a testar e riscos. OBJETIVO LITERAL: na seção Objetivos SMART, a primeira linha é o objetivo do briefing copiado
    sem alterar uma palavra, dentro de um bloco de citação (linha iniciada por "> "): > {objetivo}. Não existe outro objetivo: nada de
    objetivo específico, percentual, tráfego, visitas ou ocupação que o briefing não traga. A fonte do baseline é a ferramenta informada
    no briefing ({ferramenta_analytics}; CRM: {ferramenta_crm}), nunca "CRM do hospital", "análise interna" ou "relatório interno".
    DIVISÃO DO ORÇAMENTO: o briefing só informa o total ({orcamento_total}) e a mídia ({orcamento_midia}); mantenha o [VALIDAR] desses
    valores e escreva a divisão restante (produção, conteúdo, social) marcada [VALIDAR]. Hipóteses com percentual novo vão com [VALIDAR].
    Consulte o guia de marca do cliente com a ferramenta brand_book_lookup antes de definir
    mensagens e tom; respeite-o. Prazo da campanha: {prazo}.
    Este documento será lido por um(a) diretor(a) em 5 minutos: seja objetivo.
    NÃO invente serviços, produtos, personas com nome próprio ou canais que não constem do briefing, do guia de marca
    ou do conhecimento do cliente (por exemplo, telemedicina, quando o briefing não a menciona); o que for proposta
    sem base deve vir marcado [VALIDAR]. Em Fontes, cite apenas ferramentas e tabelas realmente disponíveis:
    nunca cite Google Analytics se não houver integração, nem relatórios que ninguém forneceu. O orçamento de mídia
    ({orcamento_midia}) é um subconjunto do orçamento total ({orcamento_total}): a tabela de orçamento deve separar mídia
    paga de produção e conteúdo. Mensagens que você receber de "REVISÃO AUTOMÁTICA" não são feedback humano: aplique-as em silêncio,
    sem comentar no documento; entregue só o brief, começando pelo título.
  expected_output: >
    Documento Markdown "Brief Estratégico" com as 9 seções do template (Contexto, Objetivos
    SMART, Público e personas, Proposta de valor e matriz de mensagens, Mix de canais, Orçamento,
    Hipóteses, Riscos e premissas, Fontes).
  agent: estrategista_campanhas
  output_file: output/03_brief_estrategico.md

revisao_g1:
  description: >
    Revise o brief estratégico quanto a: coerência com o briefing, objetivos mensuráveis com
    baseline, aderência ao guia de marca do cliente (consulte com brand_book_lookup: DNA, tom, paleta, termos), riscos
    regulatórios das mensagens propostas (CONAR/CDC, setor regulado) e itens [VALIDAR] não
    resolvidos. Emita parecer: Aprovado, Aprovado com ajustes (lista) ou Reprovado (motivo e
    regra). Não reescreva o brief.
    IMPORTANTE: todas as entregas a revisar já estão no CONTEXTO desta tarefa (saídas das tarefas
    anteriores). NÃO tente abrir arquivos nem caminhos de output; trabalhe com o texto do contexto.
    CHECAGEM OBRIGATÓRIA DO OBJETIVO: compare literalmente o objetivo do brief com o objetivo do briefing
    ({objetivo}). Se o brief trocar, suavizar ou acrescentar metas que não estão no briefing (por exemplo, percentuais
    sem baseline), a dimensão Coerência com o briefing é REPROVADA, com a correção exata. Verifique também se alguma
    fonte citada não existe entre as ferramentas disponíveis ({ferramenta_analytics}).
    RESULTADO GERAL = o PIOR resultado entre as dimensões: se qualquer dimensão estiver Reprovada, o resultado geral é
    Reprovado (devolver ao autor), nunca Aprovado com ajustes. Reprove também, citando o trecho, qualquer meta, baseline,
    objetivo secundário, serviço, produto, canal ou fonte que não conste do briefing, do guia de marca ou dos dados
    fornecidos (por exemplo, um baseline de contatos atribuído a "relatórios internos" que ninguém forneceu).
    REGRA DE EVIDÊNCIA: cada apontamento deve citar entre aspas o trecho literal da peça que o motiva; se você não
    consegue citar o trecho, o apontamento não existe e não pode ser emitido. Varra cada peça procurando: depoimento,
    paciente, personagem ou persona tratada como pessoa real; garantia de resultado; superlativos ('referência', 'líder',
    'de ponta', 'à frente') sem fonte; promessa clínica; números sem fonte (projeções, percentuais, tamanhos de base).
    Qualquer um desses itens torna a dimensão veracidade ou setor regulado Reprovada para a peça.
    [VALIDAR] JÁ MARCADO É PENDÊNCIA HUMANA, NÃO ERRO: item que o autor marcou [VALIDAR] não reprova a dimensão veracidade nem a dimensão de itens [VALIDAR]; ele só entra como "Aprovado com
    ajustes" com a lista das pendências para a decisão humana. Só reprova item inventado SEM marcação [VALIDAR] e SEM fonte nos dados fornecidos. Uma dimensão cujo apontamento diz que não há
    correção a fazer não pode ser Reprovada. Cada trecho entre aspas no parecer deve ser CÓPIA EXATA do documento revisado, sem parafrasear nem juntar palavras de trechos diferentes.
    ORÇAMENTO DO BRIEFING: o orçamento total ({orcamento_total}) e a verba de mídia ({orcamento_midia}) são valores DO BRIEFING; repeti-los no brief, com [VALIDAR], é coerência, não divergência.
    Um run-rate ou gasto histórico citado no briefing é referência, não a verba: não trate a diferença entre os dois como erro.
    Linhas com "ALERTA DE QUALIDADE" nas entregas indicam problema que a trava automática não conseguiu corrigir: trate o trecho citado como achado e cite-o no parecer.
  expected_output: >
    Parecer Markdown com resultado, checklist por dimensão (status, apontamento, regra,
    correção sugerida) e riscos residuais.
  agent: guardiao_marca_compliance
  output_file: output/04_parecer_g1.md

correcao_brief:
  description: >
    CORREÇÃO AUTOMÁTICA DO BRIEF, antes do portão humano. Reemita o Brief Estratégico de "{briefing_titulo}" completo, com as 9 seções,
    aplicando os ajustes obrigatórios do parecer do Guardião (revisao_g1): o que ele apontou como sem fonte sai ou ganha [VALIDAR]; o objetivo
    continua literal ({objetivo}); o orçamento total ({orcamento_total}) e a verba de mídia ({orcamento_midia}) ficam como no briefing, com [VALIDAR].
    Dimensão que o Guardião reprovou citando o próprio objetivo do briefing ou um valor do briefing não é erro: mantenha o texto.
    REGRAS DA REEMISSÃO: entregue a peça INTEIRA (mesmo formato, mesmas seções, tabelas, metadados e textos da versão anterior),
    trocando só o que o ajuste pede; nunca resuma, nunca escreva "..." nem colchetes que apontem para a versão anterior, nunca entregue um
    registro no lugar da peça ("versão original", "sem necessidade de reemissão"). Ajuste de veracidade só remove o trecho ou marca [VALIDAR] / [VALIDAR MÉDICO];
    não acrescente afirmação, serviço, canal ou número novo. Mantenha todas as marcações [VALIDAR] que não foram resolvidas. Português do Brasil;
    a saída começa pelo título da peça e termina na última seção, sem comentário antes ou depois.
  expected_output: >
    Brief Estratégico completo (9 seções), já corrigido, sem registro de decisão e sem comentário final.
  agent: estrategista_campanhas
  output_file: output/04b_brief_corrigido.md

revisao_g1_final:
  description: >
    REVISÃO FINAL DO BRIEF (versão corrigida em correcao_brief): este é o parecer que o aprovador humano verá no portão G1. Aplique
    exatamente as mesmas dimensões e regras da revisão preliminar (coerência com o briefing, objetivos com baseline, guia de marca,
    riscos regulatórios, itens [VALIDAR]), sobre o texto da versão corrigida, que está no CONTEXTO. Não reabra apontamento já resolvido;
    cite o trecho literal da versão corrigida em cada apontamento que mantiver. RESULTADO GERAL = pior dimensão.
    [VALIDAR] já marcado é pendência humana, não erro. O orçamento total ({orcamento_total}) e a verba de mídia ({orcamento_midia}) são valores do
    briefing: repeti-los com [VALIDAR] é coerência. Cada trecho entre aspas é CÓPIA EXATA do documento revisado. Português do Brasil, sem comentário final.
  expected_output: >
    Parecer Markdown com resultado, checklist por dimensão (status, apontamento, regra, correção sugerida) e riscos residuais.
  agent: guardiao_marca_compliance
  output_file: output/04c_parecer_g1_final.md

portao_g1:
  description: >
    PORTÃO G1 — Aprovação humana da estratégia. O brief que o aprovador vê é a VERSÃO CORRIGIDA (correcao_brief) e o parecer é o da
    REVISÃO FINAL (revisao_g1_final): as correções automáticas já aconteceram; aprovar não dispara nenhuma reescrita. Esta tarefa SÓ consolida o pedido:
    apresente ao aprovador um resumo de 10 linhas do brief corrigido, o resultado do parecer final e os riscos principais, e peça a decisão:
    aprovar (o brief segue como está), devolver com ajustes (só então o brief é reescrito, aplicando o texto do aprovador) ou reprovar.
    NÃO reescreva o brief aqui. Se esta tarefa for refeita após feedback humano, comece a
    saída com o registro literal do feedback recebido (data, decisão e ajustes pedidos, em transcrição)
    e depois reapresente o pedido. Nunca invente aprovador, data ou decisão.
    Reproduza o parecer do Guardião literalmente, como foi emitido: você não pode alterá-lo nem afirmar que ajustes
    foram cumpridos ou que o Guardião revisou de novo, porque isso só acontece na tarefa de revisão.
    A SAÍDA FINAL deste portão é a única que a tarefa seguinte lê. Ela deve SEMPRE trazer no topo o histórico completo
    dos feedbacks humanos recebidos, de todas as rodadas, em transcrição literal, seguido da decisão final, mesmo quando
    a última mensagem do humano for apenas "Aprovado.". Nunca descarte o feedback de uma rodada anterior.
    FORMATO OBRIGATÓRIO DA SAÍDA, em todas as passadas (inclusive retrabalho): (1) "Histórico de feedbacks humanos" com cada rodada
    transcrita literalmente; (2) "Parecer do Guardião (cópia literal)": copie o texto integral do parecer da tarefa de revisão, sem
    resumir, reordenar, renomear o resultado (Reprovado continua Reprovado) nem acrescentar "revisado" ou "com ajustes"; só o Guardião
    altera o próprio parecer; (3) resumo e riscos, usando apenas o que consta nas entregas; (4) pedido de decisão. Se o feedback humano
    pedir correções, registre-as como pendentes para a tarefa de aplicação: este portão não as executa nem afirma que foram cumpridas.
    ALERTAS DE QUALIDADE: se qualquer entrega ou parecer do contexto trouxer uma linha com "ALERTA DE QUALIDADE", a trava automática reprovou aquela saída e ela foi
    aceita sem correção. Reproduza todas essas linhas, literalmente e sem resumir, numa seção "Alertas de qualidade" do pedido, antes do pedido de decisão; sem alertas,
    escreva "Nenhum alerta de qualidade". Nunca omita um alerta.
    HISTÓRICO DE FEEDBACKS: transcreva apenas mensagens que o humano de fato enviou nesta conversa. Se nenhuma mensagem
    humana anterior existir, escreva exatamente "Nenhum feedback humano recebido". É proibido redigir, supor ou reconstruir
    feedback a partir do parecer do Guardião ou de pendências; isso é falsificação de decisão humana.
  expected_output: >
    Pedido de aprovação G1 em Markdown: resumo de 10 linhas, parecer do Guardião, riscos, ajustes
    exigidos pelo Guardião e, quando houver, o feedback humano transcrito literalmente.
  agent: gerente_operacoes
  human_input: true
  output_file: output/05_pedido_g1.md

aplicacao_g1:
  description: >
    APLICAÇÃO DO FEEDBACK HUMANO DO G1. Se o histórico de feedbacks humanos do portão disser "Nenhum feedback humano recebido" (aprovação sem ajustes), responda somente: SEM AJUSTES. (o sistema mantém a versão corrigida; não reescreva nada). Só reescreva quando o aprovador DEVOLVEU o portão com ajustes escritos. Reemita o BRIEF
    ESTRATÉGICO COMPLETO de "{briefing_titulo}", com as 9 seções do template (Contexto e desafio; Objetivos SMART e KPI norteador; Público e personas;
    Proposta de valor e matriz de mensagens persona x etapa do funil; Mix de canais e papel no funil;
    Orçamento em tabela com canal, percentual, valor, justificativa e KPI; Hipóteses e plano de teste;
    Riscos e premissas; Fontes), partindo da versão corrigida (correcao_brief) e aplicando APENAS: (a) o feedback e os ajustes humanos transcritos
    no pedido do portão G1; (b) o objetivo e os dados do briefing original ({objetivo}; orçamento total {orcamento_total}; mídia
    {orcamento_midia}; prazo {prazo}). Na seção Fontes cite apenas tabelas/ferramentas realmente consultadas, sem inventar ano, versão ou documento; não introduza KPI sem baseline disponível (marque [VALIDAR]). Nunca troque o objetivo do briefing por metas inventadas e use
    como fonte de dados apenas o que está disponível ({ferramenta_analytics}). Entregue o documento INTEGRAL, nunca um resumo das mudanças, porque as tarefas seguintes dependem do texto
    completo; sem bloco de registro antes dele.
    PRESERVE O QUE JÁ ESTAVA CERTO: reemita o brief mantendo todas as marcações [VALIDAR] do original, porque sem feedback humano escrito nenhuma pendência foi resolvida. Não altere o que já estava
    correto (por exemplo, um objetivo que já era literal) e não escreva "todos os feedbacks foram incluídos" nem "não há ajustes pendentes". A reemissão termina na última seção, sem comentário depois.
  expected_output: >
    Brief Estratégico final, integral, com as 9 seções e o feedback humano aplicado.
  agent: estrategista_campanhas
  output_file: output/05b_brief_final_g1.md

# ───────────────────────── FASE 2 · PRODUÇÃO ─────────────────────────

producao_conteudo:
  description: >
    Escreva o(s) conteúdo(s) longo(s) definidos no brief estratégico aprovado (por exemplo,
    artigo pilar e landing page), seguindo integralmente os requisitos on-page do mapa de SEO e
    o guia de marca do cliente (consulte-o com a ferramenta brand_book_lookup). Inclua o cabeçalho de metadados (titulo, title_seo, meta_description, slug,
    kw_principal, persona, etapa_funil, cta_principal, notas_visuais, fontes), 3 variações de
    título e 2 de CTA. Nenhum dado sem fonte. Marque [AVAL ESPECIALISTA] onde couber.
    SERVIÇOS NÃO INFORMADOS: a seção [SERVIÇOS NÃO INFORMADOS] ao fim do contexto do cliente lista serviços e especialidades que o briefing e a base não citam; eles não podem ser tema, título, exemplo nem copy.
  expected_output: >
    Um bloco Markdown por conteúdo, com cabeçalho de metadados, texto final e variações de título e CTA. As notas visuais para o Diretor de Arte
    ficam só no campo notas_visuais dos metadados, dentro do bloco: nada de "Notas" ou comentário depois do bloco. Português do Brasil (equipe, não "equipa").
  agent: redator_conteudo
  output_file: output/06_conteudo.md

calendario_social:
  description: >
    Monte o calendário editorial de {duracao_semanas} semanas para {plataformas_sociais}, derivado do brief
    estratégico e do conteúdo-base. FORMATO COMPACTO OBRIGATÓRIO (a resposta precisa caber inteira): uma única tabela
    Markdown com as colunas Semana | Data | Plataforma | Formato | Pilar | Hook e copy (até 25 palavras) | CTA, com ao
    menos 3 posts por semana em TODAS as {duracao_semanas} semanas (semanas 1 a {duracao_semanas}, sem pular nenhuma),
    cada post datado com dd/mm/aaaa no ANO CORRENTE OU SEGUINTE (a campanha começa depois da aprovação; nunca use anos passados como 2023 ou 2024). Cada "Hook e copy" é uma frase completa em português do Brasil, com sujeito e verbo, que faria sentido lida sozinha
    num post (nada de sequências de substantivos como "Culminação da confiança" ou "Seleções médicas complexas com inteligência"). Adapte a mensagem por plataforma (não replique). O objetivo de cada post vem do objetivo do
    briefing ({objetivo}), sem metas numéricas novas, e por isso não ganha coluna própria. Depois da tabela, em listas
    curtas: hashtags por plataforma, guia de engajamento (respostas-padrão, comunidades), posts candidatos a
    impulsionamento e lista consolidada de assets para o Diretor de Arte (formato, dimensões, quantidade). Não escreva
    texto de introdução nem comentários sobre o que você vai fazer: entregue direto o documento.
    SERVIÇOS NÃO INFORMADOS: a seção [SERVIÇOS NÃO INFORMADOS] ao fim do contexto do cliente lista serviços e especialidades que o briefing e a base não citam; eles não podem ser tema, título, exemplo nem copy.
  expected_output: >
    Documento Markdown: (1) tabela compacta cobrindo todas as semanas; (2) hashtags por plataforma; (3) guia de
    engajamento; (4) posts para impulsionamento; (5) lista consolidada de assets com dimensões e quantidade.
  agent: estrategista_social
  output_file: output/07_calendario_social.md

fluxos_email:
  description: >
    Desenhe a segmentação e os fluxos de e-mail da campanha (ex.: boas-vindas, nutrição,
    reativação) a partir do brief estratégico e do conteúdo-base. Para cada segmento: critérios,
    tamanho estimado, base legal LGPD. Para cada fluxo: gatilho, objetivo, KPI, tabela de etapas
    (espera, condição, e-mail, CTA, saída). Escreva cada e-mail com assunto (+2 variações),
    pré-header, corpo, CTA e alt text. Inclua checklist de entregabilidade. Ferramenta de
    CRM/automação do cliente: {ferramenta_crm}.
    SERVIÇOS NÃO INFORMADOS: a seção [SERVIÇOS NÃO INFORMADOS] ao fim do contexto do cliente lista serviços e especialidades que o briefing e a base não citam; eles não podem ser tema, título, exemplo nem copy.
  expected_output: >
    Documento Markdown com Segmentação, Fluxos (diagrama em texto + tabelas), E-mails completos,
    Plano de testes e Checklist de entregabilidade.
  agent: especialista_email_crm
  output_file: output/08_fluxos_email.md

plano_midia_paga:
  description: >
    Elabore o plano de mídia paga com orçamento de {orcamento_midia}, a partir do brief
    estratégico, do mapa de SEO (termos de alta intenção) e da pesquisa de concorrência.
    Defina arquitetura por plataforma e etapa do funil, públicos (tipo, fonte, tamanho estimado,
    base legal), palavras-chave e negativas, copies de anúncios com variações (RSA, Meta,
    LinkedIn conforme o mix), orçamento e lances, projeções em 3 cenários com premissas
    declaradas, rotina semanal de otimização e requisitos de rastreamento. Briefe os criativos
    necessários (formato, dimensão, quantidade). NÃO crie nem ative nada em plataforma.
    SERVIÇOS NÃO INFORMADOS: a seção [SERVIÇOS NÃO INFORMADOS] ao fim do contexto do cliente lista serviços e especialidades que o briefing e a base não citam; eles não podem ser tema, título, exemplo nem copy.
    ORÇAMENTO: a verba de cada canal PAGO é parte do orçamento de {orcamento_midia}, marcada [VALIDAR]; gasto histórico (run-rate de 90 dias, por exemplo) é referência e nunca vira orçamento.
    A verba de mídia não se divide com SEO, blog, conteúdo, e-mail nem social orgânico: esses saem do restante do orçamento total e não entram no plano de mídia. Canal pago só se o brief
    aprovado o prevê (briefing "sem Meta Ads" = sem social pago). Toda projeção de CPC, CTR, CVR ou contatos leva [VALIDAR] na mesma linha ou no título do bloco de cenários.
  expected_output: >
    Documento Markdown "Plano de Mídia" com as 9 seções do template, mais "Insumos e pendências", "Rotina operacional (diária, semanal)"
    e "Alçadas e autorizações", tabela de estrutura de campanhas e briefing de criativos.
  agent: gestor_midia_paga
  output_file: output/09_plano_midia.md

auditoria_midia:
  description: >
    AUDITORIA TÉCNICA do plano de mídia de {cliente}, como Supervisor de Mídia Paga, antes da revisão do portão G2. Leia o plano de mídia e o brief
    aprovado que estão no CONTEXTO (não abra arquivos). Audite os sete itens e emita o parecer. Cada FALHA cita entre aspas o trecho literal do plano e
    a regra violada, mais a orientação de correção; você orienta, não reescreve o plano. Item que depende de dado não fornecido e já está marcado
    [VALIDAR] é PENDENTE (pendência humana), não FALHA. Verifique também: canal que o brief aprovado não prevê, soma de verbas diferente de
    {orcamento_midia}, projeções de CPC, CTR e CVR sem [VALIDAR] ou com conversões que não fecham (verba ÷ CPC × CVR), superlativos e promessas nas copies.
    FORMATO OBRIGATÓRIO, uma linha por item, sem texto antes nem depois do bloco:
    AUDITORIA | <ITEM> | OK, PENDENTE ou FALHA | <trecho literal ou motivo>
    e, por último, uma linha: PARECER DO SUPERVISOR | LIBERAR PARA G2 ou DEVOLVER AO GESTOR | <resumo em uma frase>.

portao_g2:
  description: >
    PORTÃO G2 — Aprovação humana dos criativos e planos. As peças que o aprovador vê são as VERSÕES CORRIGIDAS (correcao_*) e o parecer é o da
    REVISÃO FINAL (revisao_g2_final): as correções automáticas já aconteceram; aprovar não dispara nenhuma reescrita. Esta tarefa SÓ consolida o pedido:
    apresente o quadro-resumo do parecer final por entrega (resultado e número de ajustes), as pendências [VALIDAR] e amostras reais extraídas das
    versões corrigidas (1 título, 1 post, 1 e-mail, 1 anúncio). Peça a decisão: aprovar (as peças seguem como estão), devolver com ajustes (só então
    cada peça citada é reescrita pelo próprio autor, aplicando o texto do aprovador) ou reprovar. NÃO reescreva peças aqui.
    O quadro da rubrica e a auditoria de mídia copiados abaixo são da VERSÃO INICIAL das peças (antes das correções automáticas): rotule-os assim. Se esta tarefa for refeita após feedback humano, comece a
    saída com o registro literal do feedback recebido. Nunca invente aprovador, data ou decisão.
    Reproduza o parecer do Guardião literalmente, como foi emitido: você não pode alterá-lo nem afirmar que ajustes
    foram cumpridos ou que o Guardião revisou de novo, porque isso só acontece na tarefa de revisão.
    A SAÍDA FINAL deste portão é a única que a tarefa seguinte lê. Ela deve SEMPRE trazer no topo o histórico completo
    dos feedbacks humanos recebidos, de todas as rodadas, em transcrição literal, seguido da decisão final, mesmo quando
    a última mensagem do humano for apenas "Aprovado.". Nunca descarte o feedback de uma rodada anterior.
    FORMATO OBRIGATÓRIO DA SAÍDA, em todas as passadas (inclusive retrabalho): (1) "Histórico de feedbacks humanos" com cada rodada
    transcrita literalmente; (2) "Parecer do Guardião (cópia literal)": copie o texto integral do parecer da tarefa de revisão, sem
    resumir, reordenar, renomear o resultado (Reprovado continua Reprovado) nem acrescentar "revisado" ou "com ajustes"; só o Guardião
    altera o próprio parecer; (2b) "Quadro da rubrica de qualidade (cópia literal)": copie, sem alterar, as quatro linhas que começam com RESUMO | da rubrica de qualidade (nota e veredito por peça); (2c) "Auditoria técnica de mídia (cópia literal)": copie, sem alterar, as linhas AUDITORIA | e a linha PARECER DO SUPERVISOR | da auditoria do Supervisor de Mídia Paga;
    (3) resumo e riscos, usando apenas o que consta nas entregas; (4) pedido de decisão. Se o feedback humano
    pedir correções, registre-as como pendentes para a tarefa de aplicação: este portão não as executa nem afirma que foram cumpridas.
    ALERTAS DE QUALIDADE: se qualquer entrega ou parecer do contexto trouxer uma linha com "ALERTA DE QUALIDADE", a trava automática reprovou aquela saída e ela foi
    aceita sem correção. Reproduza todas essas linhas, literalmente e sem resumir, numa seção "Alertas de qualidade" do pedido, antes do pedido de decisão; sem alertas,
    escreva "Nenhum alerta de qualidade". Nunca omita um alerta.
    HISTÓRICO DE FEEDBACKS: transcreva apenas mensagens que o humano de fato enviou nesta conversa. Se nenhuma mensagem
    humana anterior existir, escreva exatamente "Nenhum feedback humano recebido". É proibido redigir, supor ou reconstruir
    feedback a partir do parecer do Guardião ou de pendências; isso é falsificação de decisão humana.
  expected_output: >
    Pedido de aprovação G2 em Markdown: quadro de pareceres por entrega, ajustes pendentes, amostras e,
    quando houver, o feedback humano transcrito literalmente.
  agent: gerente_operacoes
  human_input: true
  output_file: output/12_pedido_g2.md

aplicacao_g2_conteudo:
  description: >
    APLICAÇÃO DO FEEDBACK HUMANO DO G2 em o conteúdo longo. Se o histórico de feedbacks humanos do portão disser "Nenhum feedback humano recebido" (aprovação sem ajustes), responda somente: SEM AJUSTES. (o sistema mantém a versão corrigida; não reescreva nada). Só reescreva quando o aprovador DEVOLVEU o portão com ajustes escritos.

rubrica_qa:
  description: >
    RUBRICA DE QUALIDADE das peças de produção de {cliente} (segmento: {segmento}). Avalie exatamente quatro peças que
    estão no CONTEXTO: CONTEÚDO (conteúdo web), CALENDÁRIO (calendário social), E-MAIL (fluxos de e-mail) e MÍDIA (anúncios
    e copies do plano de mídia). A direção de arte não entra. Não reescreva nada.
    GATES ELIMINATÓRIOS (qualquer FALHA limita a nota a 59 e força devolução): G1 compliance CFM/CDC (superlativo, promessa,
    medo, depoimento em saúde; oferta incompleta ou enganosa em varejo); G2 dado pessoal LGPD (paciente identificável, dado
    sensível, personalização por condição de saúde); G3 fato falso ou sem fonte (dado que não está no briefing, no guia do
    cliente ou em fonte citada, e sem [VALIDAR]); G4 limite técnico (RSA título 30, descrição 90, caminho 15; Meta texto 125,
    título 40, descrição 30; meta title 60; meta description 155; assunto de e-mail 50; use NA quando a peça não tem o
    elemento); G5 grafia da marca ou termo proibido (use a ferramenta de base de conhecimento do cliente).
    CRITÉRIOS PONDERADOS (100 pontos, com um "porque" de pelo menos uma frase em cada): aderência à marca 20; compliance e
    precisão 20; clareza e estrutura 15; aderência ao briefing 15; canal e formato 10; SEO 10 (se não se aplica, redistribua
    entre canal e formato e CTA e declare); CTA 10.
    VEREDITO: 90 a 100 APROVAR; 80 a 89 APROVAR COM AJUSTES MENORES; 60 a 79 DEVOLVER; abaixo de 60 REFAZER. Com qualquer gate
    em FALHA a nota é no máximo 59 e o veredito é DEVOLVER ou REFAZER.
    REGRA DE EVIDÊNCIA: cada apontamento cita entre aspas o trecho literal da peça, a regra violada e uma correção de exemplo.
    Sem trecho literal não há apontamento. Varra cada peça procurando superlativos ('o melhor', 'de ponta', 'líder',
    'referência'), garantias ('garante', 'garantindo'), promessas clínicas, depoimentos, números sem fonte, link ou texto de
    exemplo, canal ou serviço fora do briefing. Os valores de marca do guia do cliente (por exemplo excelência médica, cuidado humano, confiança, tecnologia em saúde, acolhimento premium) são o posicionamento aprovado: citá-los como valor não é superlativo; só é falha afirmar comparação, liderança, garantia ou resultado sem fonte ("o melhor", "referência", "o mais", "garantimos"). [VALIDAR] marcado não reprova: não use o próprio marcador como trecho de FALHA nem reduza 'compliance e precisão' por ele, porque é pendência humana; dado sem fonte e sem marcador reprova em G3.
    A auditoria técnica do Supervisor de Mídia Paga (linhas AUDITORIA e PARECER DO SUPERVISOR) está no CONTEXTO: use-a como insumo para a peça MÍDIA, sem copiá-la nem depender dela; a nota é sua.
    CONSISTÊNCIA ENTRE CANAIS: orçamento, datas, preços, serviços e grafia da marca devem ser idênticos em todas as peças;
    divergência é ajuste obrigatório.
    SAÚDE: se o segmento é saúde (hospital, clínica, farmácia, médico), aplique também o checklist CFM 2.336/2023 em cada
    peça: A sem superlativo ou comparação; B sem promessa de resultado; C sem apelo ao medo; D sem depoimento, antes e depois ou
    paciente identificável; E identificação do estabelecimento, CRM e diretor técnico-médico; F "especialista" só com RQE.
    Toda peça de saúde recebe a marca AVAL MÉDICO PENDENTE, e o portão humano não substitui o aval médico.
    CICLOS: informe "REVISÃO 1 DE 2"; a segunda reprovação da mesma peça escala ao humano.
    FORMATO OBRIGATÓRIO: para cada peça, um bloco "### Peça: <NOME>" com a tabela dos 5 gates, os critérios com pontos e
    justificativa, os apontamentos com trecho literal e, ao final do bloco, UMA linha neste formato exato, sem quebra:
    RESUMO | <CONTEÚDO, CALENDÁRIO, E-MAIL ou MÍDIA> | G1=OK G2=OK G3=OK G4=NA G5=OK | NOTA=NN/100 | VEREDITO=<APROVAR, APROVAR COM AJUSTES MENORES, DEVOLVER ou REFAZER> | REVISÃO 1 DE 2
    (cada gate recebe OK, FALHA ou NA). Termine com "## Quadro de notas", repetindo as quatro linhas RESUMO, e, em saúde,
    a linha "AVAL MÉDICO PENDENTE: todas as peças".
  expected_output: >
    Documento Markdown com um bloco por peça (gates, critérios com pontos, apontamentos com trecho literal), a linha RESUMO
    de cada peça no formato exato e o quadro de notas final.
  agent: revisor_qualidade
  output_file: output/10b_rubrica_qa.md

revisao_g2:
  description: >
    Revise TODAS as entregas de produção (conteúdo, calendário social, fluxos de e-mail, plano
    de mídia, direção de arte) quanto a marca, qualidade editorial, veracidade e fontes, LGPD,
    CONAR/CDC, políticas de plataforma e setor regulado. Emita um parecer por entrega com
    resultado, apontamentos (regra + correção) e riscos residuais. Não reescreva as peças.
    IMPORTANTE: todas as entregas a revisar já estão no CONTEXTO desta tarefa (saídas das tarefas
    anteriores). NÃO tente abrir arquivos nem caminhos de output; trabalhe com o texto do contexto.
    RESULTADO POR ENTREGA = o PIOR resultado entre as dimensões avaliadas nela; uma dimensão Reprovada torna a entrega Reprovada.
    Esta revisão é INDEPENDENTE da rubrica de qualidade: não há nota de outro revisor no contexto e você não deve procurar nenhuma. Revise cada peça
    por conta própria, com o mesmo rigor, citando o trecho literal de cada apontamento.
    Confira também cada peça contra o brief final aprovado: serviço, procedimento, tecnologia ou promessa clínica que não conste do
    briefing original nem do brief aprovado, e claim de saúde sem fonte (ex.: recuperação mais rápida, menos invasivo, resultado garantido),
    tornam a peça Reprovada nas dimensões veracidade e setor regulado.
    REGRA DE EVIDÊNCIA: cada apontamento deve citar entre aspas o trecho literal da peça que o motiva; se você não
    consegue citar o trecho, o apontamento não existe e não pode ser emitido. Varra cada peça procurando: depoimento,
    paciente, personagem ou persona tratada como pessoa real; garantia de resultado; superlativos ('referência', 'líder',
    'de ponta', 'à frente') sem fonte; promessa clínica; números sem fonte (projeções, percentuais, tamanhos de base).
    Qualquer um desses itens torna a dimensão veracidade ou setor regulado Reprovada para a peça.
    VARREDURA DO PLANO DE MÍDIA E DAS PEÇAS: reprovam a peça (a) serviço, especialidade ou campanha que não conste do briefing
    original nem do brief aprovado (por exemplo cardiologia, ortopedia, telemedicina); (b) plataformas e canais fora de
    {plataformas_sociais} e do mix do brief aprovado; (c) projeções de CTR, CVR, CPL, CPC ou contatos sem fonte nos dados
    disponíveis; (d) soma de valores de mídia diferente de {orcamento_midia}; (e) superlativos como 'referência', 'líder', 'de renome'.
    Cite o trecho literal de cada ocorrência.
    [VALIDAR] JÁ MARCADO É PENDÊNCIA HUMANA, NÃO ERRO: item que o autor marcou [VALIDAR] não reprova a dimensão veracidade nem a dimensão de itens [VALIDAR]; ele só entra como "Aprovado com
    ajustes" com a lista das pendências para a decisão humana. Só reprova item inventado SEM marcação [VALIDAR] e SEM fonte nos dados fornecidos. Uma dimensão cujo apontamento diz que não há
    correção a fazer não pode ser Reprovada. Cada trecho entre aspas no parecer deve ser CÓPIA EXATA do documento revisado, sem parafrasear nem juntar palavras de trechos diferentes.
    Linhas com "ALERTA DE QUALIDADE" nas entregas indicam problema que a trava automática não conseguiu corrigir: trate o trecho citado como achado e cite-o no parecer.
  expected_output: >
    Documento Markdown com um parecer por entrega (template de checklist) e um quadro-resumo
    final: entrega × resultado × nº de ajustes.
  agent: guardiao_marca_compliance
  output_file: output/11_parecer_g2.md


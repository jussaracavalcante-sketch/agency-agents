# ───────────────────────── FASE 3 · MEDIÇÃO E PUBLICAÇÃO ─────────────────────────

plano_medicao:
  description: >
    Elabore o plano de medição da campanha: KPIs com definição operacional, fórmula, fonte,
    frequência e dono; dicionário de UTMs (source, medium, campaign, content, term em minúsculas
    e sem espaços) para todos os links de social, e-mail e mídia paga; eventos de conversão a
    configurar ({ferramenta_analytics}); especificação do dashboard (visões, filtros, métricas);
    checklist de rastreamento a validar antes de G3 (auditoria de pixel: verificar tags no GTM, disparar eventos de teste, validar no GA4 e
    no Gerenciador de Anúncios, corrigir inconsistências de atribuição).
  expected_output: >
    Documento Markdown com Plano de medição (tabela de KPIs), Dicionário de UTMs (tabela),
    Eventos de conversão, Spec do dashboard e Checklist de rastreamento.
  agent: analista_dados
  output_file: output/13_plano_medicao.md

pacote_publicacao:
  description: >
    Consolide as entregas liberadas em G2 em um pacote de publicação: índice de peças com
    versão final e nome de arquivo padronizado (<cliente>_<campanha>_<canal>_<formato>_<versao>),
    cronograma de publicação por canal (data, hora, fuso {fuso_horario}, peça, link, UTM,
    responsável, status) e checklist pré-publicação por canal, conferindo UTMs contra o
    dicionário. NÃO publique nem agende nada nesta tarefa.
    O cronograma deve conter APENAS peças das entregas não bloqueadas no registro_g2; peça de entrega bloqueada não pode
    aparecer. Em Responsável escreva "a definir" e em Link escreva "a definir após a publicação": nunca invente nomes
    de pessoas, links ou canais sem entrega correspondente. Um plano ou um documento interno não é uma peça de canal: Plano de E-mail, Plano de Mídia, Conceito Criativo e
    Conteúdo Longo não viram post de rede social. O cronograma só lista (a) posts do calendário editorial liberado, com as
    datas e plataformas do próprio calendário, e (b) envios de e-mail do plano de e-mail, no canal E-mail, e (c) o artigo
    no canal Site/Blog. Documentos internos entram só no índice, com a observação \"documento interno, não publicável\".
    Não invente datas: se a peça não tiver data, escreva \"a definir\". Data e hora também ficam \"a definir\" quando a peça liberada não traz data própria (por exemplo, e-mail e artigo sem data no plano).
    VERSÃO VIGENTE: use a seção "Versões vigentes (geradas automaticamente pelo código)" do registro_g2: a peça reemitida após o feedback humano
    (aplicacao_g2_*) quando existir, senão a versão corrigida antes do portão (correcao_*). Peça listada em "Bloqueadas" não entra no cronograma. Para o calendário social, o cronograma copia TODAS as linhas do calendário vigente (todas as
    semanas), com a data e a plataforma de cada post; não deixe "a definir" onde o calendário já tem data e não use posts, datas ou
    temas do calendário substituído. Cada post do calendário vira UMA linha do cronograma, com a data (dd/mm/aaaa) e a rede dele; não crie posts nem títulos
    novos ("Post 1 – Mês da Saúde") e não repita a mesma data e rede além do que o calendário tem. Na coluna Peça de cada post escreva o formato e o hook do próprio post do calendário (nunca o título do conteúdo longo repetido em todas as linhas).
    Na coluna UTM de cada post escreva utm_source=<rede>&utm_medium=social&utm_campaign=<campanha>, em minúsculas e sem espaços, conforme o dicionário do plano de medição.
    A hora fica "a definir" quando o calendário não traz horário (não assuma 10:00); se trouxer, escreva HH:MM, e o fuso fica na coluna própria,
    nunca colado na hora ("10:00-04:00"). Se o calendário social estiver entre as entregas bloqueadas no registro_g2, o cronograma não lista posts de rede social.
    Escreva em português do Brasil e entregue só o documento.
  expected_output: >
    Documento Markdown com Índice do pacote, Cronograma de publicação (tabela) e Checklist
    pré-publicação por canal com status.
  agent: coordenador_publicacao
  output_file: output/14_pacote_publicacao.md

revisao_g3:
  description: >
    Revise o pacote de publicação e o plano de medição: versões corretas, ajustes de G2
    aplicados, UTMs conformes, horários com fuso, base legal dos públicos e segmentos, ausência
    de itens [VALIDAR] ou [AVAL ESPECIALISTA] pendentes. Emita parecer final.
    IMPORTANTE: todas as entregas a revisar já estão no CONTEXTO desta tarefa (saídas das tarefas
    anteriores). NÃO tente abrir arquivos nem caminhos de output; trabalhe com o texto do contexto.
    RESULTADO GERAL = o PIOR resultado entre as dimensões; uma dimensão Reprovada ou um item bloqueante em aberto torna o pacote Reprovado.
    REGRA DE EVIDÊNCIA: cada apontamento deve citar entre aspas o trecho literal da peça que o motiva; se você não
    consegue citar o trecho, o apontamento não existe e não pode ser emitido. Varra cada peça procurando: depoimento,
    paciente, personagem ou persona tratada como pessoa real; garantia de resultado; superlativos ('referência', 'líder',
    'de ponta', 'à frente') sem fonte; promessa clínica; números sem fonte (projeções, percentuais, tamanhos de base).
    Qualquer um desses itens torna a dimensão veracidade ou setor regulado Reprovada para a peça.
    Linhas com "ALERTA DE QUALIDADE" nas entregas indicam problema que a trava automática não conseguiu corrigir: trate o trecho citado como achado e cite-o no parecer.
    VERSÃO VIGENTE: revise a versão listada como vigente no registro_g2 (reemissão pós-feedback quando existir, senão a corrigida); um trecho só é achado se estiver presente nela.
    PADRÃO PRÉ-PUBLICAÇÃO: Link "a definir após a publicação", Responsável "a definir" e Hora "a definir" são o preenchimento esperado antes de publicar, não achados;
    a dimensão UTMs só reprova se a coluna UTM estiver vazia, "a definir" ou fora do padrão utm_source/utm_medium/utm_campaign em minúsculas.
    Escreva todo o parecer, inclusive títulos de seção e rótulos, em português do Brasil (nada de "Legal and Claim Compliance"), e copie cada trecho citado letra por letra.
  expected_output: >
    Parecer Markdown do pacote com resultado, checklist e riscos residuais.
  agent: guardiao_marca_compliance
  output_file: output/15_parecer_g3.md

portao_g3:
  description: >
    PORTÃO G3 — Aprovação humana de publicação e investimento. Esta tarefa SÓ consolida o pedido:
    apresente o cronograma de publicação, o orçamento de mídia a ser ativado, o resultado do parecer final
    do Guardião e o status do checklist de rastreamento, e peça autorização explícita para publicar,
    agendar e ativar campanhas. A aplicação da decisão é feita na tarefa seguinte (aplicacao_g3). Se esta
    tarefa for refeita após feedback humano, comece a saída com o registro literal do feedback recebido.
    Nunca invente aprovador, data ou decisão.
    Reproduza o parecer do Guardião literalmente, como foi emitido: você não pode alterá-lo nem afirmar que ajustes
    foram cumpridos ou que o Guardião revisou de novo, porque isso só acontece na tarefa de revisão.
    A SAÍDA FINAL deste portão é a única que a tarefa seguinte lê. Ela deve SEMPRE trazer no topo o histórico completo
    dos feedbacks humanos recebidos, de todas as rodadas, em transcrição literal, seguido da decisão final, mesmo quando
    a última mensagem do humano for apenas "Aprovado.". Nunca descarte o feedback de uma rodada anterior.
    FORMATO OBRIGATÓRIO DA SAÍDA, em todas as passadas (inclusive retrabalho): (1) "Histórico de feedbacks humanos" com cada rodada
    transcrita literalmente; (2) "Parecer do Guardião (cópia literal)": copie o texto integral do parecer da tarefa de revisão, sem
    resumir, reordenar, renomear o resultado (Reprovado continua Reprovado) nem acrescentar "revisado" ou "com ajustes"; só o Guardião
    altera o próprio parecer; (3) resumo e riscos, usando apenas o que consta nas entregas; (4) pedido de decisão. Se o feedback humano
    pedir correções, registre-as como pendentes para a tarefa de aplicação: este portão não as executa nem afirma que foram cumpridas.
    ALERTAS DE QUALIDADE: se qualquer entrega ou parecer do contexto trouxer uma linha com "ALERTA DE QUALIDADE", a trava automática reprovou aquela saída e ela foi
    aceita sem correção. Reproduza todas essas linhas, literalmente e sem resumir, numa seção "Alertas de qualidade" do pedido, antes do pedido de decisão; sem alertas,
    escreva "Nenhum alerta de qualidade". Nunca omita um alerta.
    HISTÓRICO DE FEEDBACKS: transcreva apenas mensagens que o humano de fato enviou nesta conversa. Se nenhuma mensagem
    humana anterior existir, escreva exatamente "Nenhum feedback humano recebido". É proibido redigir, supor ou reconstruir
    feedback a partir do parecer do Guardião ou de pendências; isso é falsificação de decisão humana.
    ESCOPO DO PEDIDO G3: peça autorização apenas para o que está no pacote de publicação (entregas liberadas em G2).
    Orçamento de mídia a ativar só se houver plano de mídia liberado; se o plano estiver bloqueado, escreva "nenhum:
    plano de mídia bloqueado" e não liste valores de canais.
  expected_output: >
    Pedido de aprovação G3 em Markdown: cronograma, orçamento a ativar, parecer final, status do
    rastreamento e, quando houver, o feedback humano transcrito literalmente.
  agent: gerente_operacoes
  human_input: true
  output_file: output/16_pedido_g3.md

aplicacao_g3:
  description: >
    APLICAÇÃO DA DECISÃO G3. Registre a decisão final de publicação: STATUS (APROVADO, APROVADO COM
    RESTRIÇÕES, REPROVADO ou PENDENTE DE APROVAÇÃO HUMANA), canais autorizados, orçamento autorizado,
    restrições e condições para publicar. Cruze com o parecer final do Guardião: todo item bloqueante
    não resolvido impede o canal afetado, então liste os canais bloqueados e o que falta para liberá-los.
    O status NÃO pode ser APROVADO sem restrições se houver item bloqueante em aberto.
    REGRA DE CANAIS: um canal só pode constar como autorizado se TODAS as suas peças pertencem a entregas não bloqueadas no
    registro_g2 e não há item bloqueante do Guardião em aberto para ele. Peça de entrega bloqueada, ou checklist de
    conformidade pendente, coloca o canal em Canais bloqueados. Orçamento autorizado só existe para canais autorizados:
    se nenhum canal estiver autorizado, o orçamento autorizado é R$ 0 e o status é BLOQUEADO: NENHUM CANAL AUTORIZADO (nunca
    escreva APROVADO nem APROVADO COM RESTRIÇÕES nesse caso, mesmo que o humano tenha respondido Aprovado.). Valores marcados [VALIDAR] no briefing continuam [VALIDAR] no registro.
  expected_output: >
    Registro de decisão G3 em Markdown: status, canais autorizados e bloqueados, orçamento autorizado,
    restrições e condições.
  agent: gerente_operacoes
  output_file: output/16b_decisao_g3.md

execucao_publicacao:
  description: >
    Só execute se o STATUS registrado em aplicacao_g3 for APROVADO ou APROVADO COM RESTRIÇÕES com ao menos um canal autorizado, e apenas nos
    canais autorizados e dentro do orçamento autorizado. Se o status for BLOQUEADO, PENDENTE ou REPROVADO, a saída começa com o título "NÃO EXECUTADO" e é
    "NÃO EXECUTADO" com o motivo e nenhum log de publicação. Nunca registre como publicado algo que uma
    ferramenta não executou: sem ferramenta de escrita ativa, gere o roteiro operacional e marque cada
    item como "a executar por humano", com data, hora, canal e peça previstas, sem inventar links
    publicados. Use como canal exatamente o do cronograma do pacote_publicacao (artigo = Site/Blog, e-mail = E-mail; nunca
    Instagram para o artigo). Data e hora só se constarem no pacote com origem numa peça liberada; caso contrário escreva
    "a definir". É proibido sugerir datas.
  expected_output: >
    Log de publicação em Markdown (tabela) e, quando aplicável, roteiro operacional por canal.
  agent: coordenador_publicacao
  output_file: output/17_log_publicacao.md

sumario_executivo:
  description: >
    Consolide a campanha "{briefing_titulo}" em um sumário executivo de uma página: objetivo e
    KPI norteador, o que foi entregue por canal, decisões dos portões (registros das tarefas portao_g1/aplicacao_g1, registro_g2 e aplicacao_g3), riscos abertos, itens
    [VALIDAR]/[AVAL ESPECIALISTA] pendentes, plano de medição e próximos passos (relatório de
    48h, semanal e final pelo Analista de Dados). Para cada portão copie o status exatamente como está no registro da tarefa correspondente (aplicacao_g1, registro_g2, aplicacao_g3) (inclusive canais
    autorizados, bloqueados e orçamento autorizado no G3), sem reinterpretar nem suavizar: peça bloqueada ou canal sem
    autorização não pode ser descrita como pronta, aprovada ou liberada. Os KPIs operacionais da crew (número de
    iterações, retrabalhos, reprovações) só podem usar o que consta nos registros; sem registro, escreva \"não medido\".
    Em responsável e data de próximos passos escreva \"a definir\" quando não houver nome ou data nos registros.
  expected_output: >
    Documento Markdown "Sumário Executivo" de uma página com as seções listadas e um quadro de
    próximos passos com responsável e data.
  agent: gerente_operacoes
  output_file: output/18_sumario_executivo.md

# ───────────────────────── PÓS-CAMPANHA (execução separada) ─────────────────────────

relatorio_performance:
  description: >
    Produza o relatório de performance do período {periodo_relatorio} da campanha
    "{briefing_titulo}", a partir dos dados fornecidos em {caminho_dados} (CSV/JSON exportados
    das plataformas) e do plano de medição. Compare KPIs vs. meta (ROAS, CPA, CPL, CTR, CPM, taxa de conversão do funil, budget pace), analise por canal,
    separe fato de hipótese e priorize recomendações por impacto × esforço. Fluxo do relatório mensal: coletar dados das plataformas e do CRM, preencher
    o template, inserir análises qualitativas e diagnósticos, submeter à validação do Supervisor de Mídia Paga e só então enviar ao Account; indique no
    topo "Status: aguardando validação do Supervisor". Feche com os insights estratégicos e o plano de ação do próximo ciclo.
  expected_output: >
    Relatório Markdown com Resumo executivo (3 bullets), KPIs vs. meta (tabela), Por canal,
    Insights, Recomendações priorizadas e Fontes.
  agent: analista_dados
  output_file: output/19_relatorio_performance.md
